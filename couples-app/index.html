<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1a1625" />
<title>Us</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="css/style.css" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-heart">💜</div>
    <h1>Us</h1>
    <p>Who's this?</p>
    <div class="login-buttons">
      <button data-user="me">Athirah 💗</button>
      <button data-user="bf">Naqib 💙</button>
    </div>
  </div>
</div>

<div id="app" class="app hidden">

  <header class="app-header">
    <div class="header-title" id="header-title">Today</div>
    <div class="header-user" id="header-user"></div>
  </header>

  <main class="app-main" id="app-main">
    <section class="tab-view" data-tab="today"></section>
    <section class="tab-view hidden" data-tab="games"></section>
    <section class="tab-view hidden" data-tab="plans"></section>
    <section class="tab-view hidden" data-tab="feed"></section>
    <section class="tab-view hidden" data-tab="finance"></section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item" data-tab="plans">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>Plans</span>
    </button>
    <button class="nav-item" data-tab="games">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/></svg>
      <span>Games</span>
    </button>
    <button class="nav-item nav-center active" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0112 6a5.5 5.5 0 019.5 6C19 16.5 12 21 12 21z"/></svg>
      <span>Today</span>
    </button>
    <button class="nav-item" data-tab="feed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <span>Feed</span>
    </button>
    <button class="nav-item" data-tab="finance">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      <span>Finance</span>
    </button>
  </nav>

</div>

<script src="js/app.js"></script>
<script src="js/today.js"></script>
<script src="js/games.js"></script>
<script src="js/plans.js"></script>
<script src="js/feed.js"></script>
<script src="js/finance.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
</script>
</body>
</html>
