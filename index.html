<!--
  OLD PORTFOLIO NOTICE (for the GitHub Pages portfolio)
  ======================================================
  1. Open your old portfolio's index.html on GitHub (the pencil icon to edit).
  2. Paste EVERYTHING below this comment just before the closing </body> tag.
  3. The link already points to https://atrh.xo.je/ (change NEW_PORTFOLIO_URL near the bottom if that ever moves).
  4. Commit. GitHub Pages updates in a minute or two.

  The bar sits at the top of the page, pushes nothing around, and remembers when a visitor closes it (for that visit).
-->
<div id="newPfBar" role="region" aria-label="New portfolio notice" hidden>
  <span class="npf-wave" aria-hidden="true">👋</span>
  <span class="npf-text"><b>I&#39;m moving to a new portfolio.</b> You can view it here.</span>
  <a class="npf-go" id="newPfLink" href="#" target="_blank" rel="noopener">View here <span aria-hidden="true">&rarr;</span></a>
  <button class="npf-x" type="button" aria-label="Hide this notice">&times;</button>
</div>
<style>
  #newPfBar{position:fixed;left:0;right:0;top:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
    padding:10px 52px 10px 16px;font:500 14px/1.4 'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff;
    background:linear-gradient(90deg,#1a2a6c,#4a6ae0,#7b5cff,#1a2a6c);background-size:300% 100%;animation:npfFlow 12s ease infinite,npfIn .5s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 8px 24px -10px rgba(10,15,40,.6)}
  #newPfBar[hidden]{display:none}
  #newPfBar .npf-wave{display:inline-block;font-size:18px;transform-origin:70% 80%;animation:npfWave 2.4s ease-in-out infinite}
  #newPfBar .npf-text b{font-weight:700}
  #newPfBar .npf-go{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:#fff;color:#1a2a6c;font-weight:700;text-decoration:none;white-space:nowrap;transition:transform .2s,box-shadow .2s}
  #newPfBar .npf-go:hover{transform:translateY(-1px);box-shadow:0 6px 16px -6px rgba(0,0,0,.45)}
  #newPfBar .npf-x{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:20px;line-height:1;cursor:pointer}
  #newPfBar .npf-x:hover{background:rgba(255,255,255,.3)}
  body.npf-on{padding-top:var(--npf-h,52px)!important}
  @keyframes npfFlow{50%{background-position:100% 0}}
  @keyframes npfIn{from{transform:translateY(-100%)}}
  @keyframes npfWave{0%,60%,100%{transform:none}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
  @media(max-width:600px){#newPfBar{font-size:13px;padding:10px 46px 12px 14px;text-align:center}}
  @media(prefers-reduced-motion:reduce){#newPfBar,#newPfBar .npf-wave{animation:none}}
</style>
<script>
(function () {
  var NEW_PORTFOLIO_URL = 'https://atrh.xo.je/';   // your new portfolio (InfinityFree)
  var bar = document.getElementById('newPfBar');
  document.getElementById('newPfLink').href = NEW_PORTFOLIO_URL;
  try { if (sessionStorage.getItem('npfHidden') === '1') return; } catch (e) {}
  bar.hidden = false;
  function fit() { document.body.style.setProperty('--npf-h', bar.offsetHeight + 'px'); }
  document.body.classList.add('npf-on'); fit(); addEventListener('resize', fit);
  bar.querySelector('.npf-x').addEventListener('click', function () {
    bar.hidden = true; document.body.classList.remove('npf-on');
    try { sessionStorage.setItem('npfHidden', '1'); } catch (e) {}
  });
})();
</script>
